<!-- billing/templates/billing/payment_confirm_delete.html -->
{% extends 'rooms/room.html' %}

{% block title %}Delete Payment{% endblock %}

{% block content %}
    <h1 style="color: #dc2626; margin-bottom: 1rem;">Delete Payment</h1>
    
    <div style="background-color: #fef2f2; border: 1px solid #fecaca; border-radius: 6px; padding: 1.5rem; margin-bottom: 2rem;">
        <p style="margin: 0; color: #991b1b; font-size: 1.1rem;">
            Are you sure you want to delete payment <strong>#{{ payment.payment_id }}</strong> of <strong>${{ payment.amount }}</strong>? This action cannot be undone.
        </p>
    </div>

    <form method="post" style="display: flex; gap: 1rem; align-items: center;">
        {% csrf_token %}
        <button type="submit" class="btn" style="background-color: #dc2626; margin: 0;">Confirm Delete</button>
        <a href="{% url 'payment_detail' payment.payment_id %}" style="color: #64748b; text-decoration: none; font-weight: 500;">Cancel</a>
    </form>
{% endblock %}
