{% extends 'rooms/room.html' %}

{% block title %}Log in{% endblock %}

{% block content %}
    <h1>Log in</h1>
    {% if form.errors %}
        <p role="alert">Your username and password did not match.</p>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit">Log in</button>
    </form>
{% endblock %}
