<!-- rooms/templates/rooms/room_type_form.html -->
{% extends 'rooms/room.html' %}

{% block title %}{{ action }} Room Type{% endblock %}

{% block content %}
    <h1 style="margin-bottom: 1.5rem;">{{ action }} Room Type</h1>
    
    <form method="post" style="max-width: 600px;">
        {% csrf_token %}
        
        <div class="form-container">
            {{ form.as_p }}
        </div>

        <div style="display: flex; gap: 1rem; align-items: center; margin-top: 1.5rem;">
            <button type="submit" style="margin: 0;">Save</button>
            <a href="{% url 'room_type_list' %}" class="btn" style="background-color: #64748b; margin: 0; text-decoration: none;">Cancel</a>
        </div>
    </form>
{% endblock %}
